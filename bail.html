<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bail Eligibility Checker (IPC & BNS) | Naga Law Chambers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* Tool-specific overrides */
        .tool-container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #555;
            transition: 0.3s;
        }

        input {
            width: 100%;
            padding: 16px 16px 16px 50px;
            background: #0f0f0f;
            border: 1px solid rgba(255, 215, 0, 0.15);
            color: #fff;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 1.1rem;
            transition: 0.3s;
            font-family: var(--font-body);
        }

        input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1);
        }

        input:focus+i {
            color: var(--primary);
        }

        /* Result Cards */
        #resultArea {
            display: none;
            margin-top: 30px;
        }

        .result-card {
            background: #121212;
            padding: 35px;
            border-radius: 16px;
            border-left: 5px solid var(--primary);
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        .result-card h2.bailable {
            color: #2ecc71;
        }

        .result-card h2.non-bailable {
            color: #ff4757;
        }

        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: #1a1a1a;
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 0 0 12px 12px;
            z-index: 10;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .suggestions div {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #333;
            color: #ccc;
        }

        .suggestions div:hover {
            background: rgba(255, 215, 0, 0.1);
            color: var(--primary);
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="main-header" style="position:relative; background: #0a0a0a;">
        <div class="container header-inner">
            <a href="index.html" class="logo">NAGA <span class="text-gold">LEGAL</span></a>
            <nav class="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="tools.html" class="nav-link">Back to Dashboard</a>
            </nav>
        </div>
    </header>

    <div class="section">
        <div class="tool-container">
            <div style="text-align: center; margin-bottom: 40px;">
                <h1 class="display-2"><i class="fa-solid fa-handcuffs text-gold"></i> Bail Checker</h1>
                <p class="text-muted">Instant Eligibility Check (IPC & BNS)</p>
            </div>

            <div class="card">
                <div class="input-group">
                    <label>Search by Section or Offense</label>
                    <div class="input-wrapper">
                        <input type="text" id="sectionInput" placeholder="e.g., 420, Murder, Theft, 302..."
                            onkeyup="showSuggestions()">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <div class="suggestions" id="suggestions"></div>
                    </div>
                </div>
                <button class="btn btn-primary" style="width: 100%;" onclick="checkBail()">
                    <i class="fa-solid fa-gavel"></i> Check Eligibility
                </button>
            </div>

            <div id="resultArea">
                <div class="result-card">
                    <div class="section-name" id="sectionName"
                        style="color:var(--primary); font-size: 1.3rem; margin-bottom: 10px; font-weight: bold;"></div>
                    <div class="offense" id="offense" style="color:#888; margin-bottom: 20px; font-style: italic;">
                    </div>
                    <h2 id="resultTitle" style="font-size: 2rem; margin-bottom: 15px;"></h2>
                    <p id="resultDesc" style="color:#bbb; font-size: 1rem; line-height: 1.6;"></p>

                    <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid #333;">
                        <p style="font-size: 0.8rem; color: #666; margin-bottom: 20px;">
                            <i class="fa-solid fa-triangle-exclamation"></i> <strong>Disclaimer:</strong> Informational
                            only. Consult a lawyer for accurate advice.
                        </p>
                        <a href="#" id="waLink" target="_blank" class="btn btn-outline" style="width: 100%;">
                            <i class="fa-brands fa-whatsapp"></i> Consult Advocate on WhatsApp
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Logic (Preserved) -->
    <script>
        // Expanded Database
        const bailData = [
            { id: '302', offense: 'Murder', bailable: false, desc: 'Punishment: Death or Life Imprisonment. Strictly Non-Bailable. Bail is rare and requires High Court intervention.' },
            { id: '304', offense: 'Culpable Homicide not amounting to Murder', bailable: false, desc: 'Non-Bailable. Depending on evidence and intent, bail can be challenged.' },
            { id: '304A', offense: 'Causing death by negligence', bailable: true, desc: 'Bailable offense. Police can grant bail.' },
            { id: '307', offense: 'Attempt to Murder', bailable: false, desc: 'Non-Bailable. If injury is minor, bail chances improve after some custody.' },
            { id: '323', offense: 'Voluntarily causing hurt', bailable: true, desc: 'Bailable. You can get bail at the police station.' },
            { id: '324', offense: 'Voluntarily causing hurt by dangerous weapons', bailable: false, desc: 'Non-Bailable. Requires court application.' },
            { id: '325', offense: 'Voluntarily causing grievous hurt', bailable: true, desc: 'Bailable offense.' },
            { id: '326', offense: 'Voluntarily causing grievous hurt by dangerous weapons', bailable: false, desc: 'Non-Bailable. Serious offense.' },
            { id: '354', offense: 'Assault on woman with intent to outrage modesty', bailable: false, desc: 'Non-Bailable (in Andhra Pradesh/many states). Serious offense.' },
            { id: '354A', offense: 'Sexual Harassment', bailable: true, desc: 'Bailable offense (for first 3 clauses).' },
            { id: '354B', offense: 'Assault with intent to disrobe', bailable: false, desc: 'Non-Bailable.' },
            { id: '354C', offense: 'Voyeurism', bailable: true, desc: 'Bailable (First conviction). Non-Bailable (Second conviction).' },
            { id: '354D', offense: 'Stalking', bailable: true, desc: 'Bailable (First conviction). Non-Bailable (Second conviction).' },
            { id: '363', offense: 'Kidnapping', bailable: false, desc: 'Non-Bailable (in many states). Bailable in some if not for ransom.' },
            { id: '376', offense: 'Rape', bailable: false, desc: 'Strictly Non-Bailable. Bail is extremely difficult.' },
            { id: '379', offense: 'Theft', bailable: false, desc: 'Non-Bailable (Amendment in AP makes it Non-Bailable if value > certain amount, generally treated as NB).' },
            { id: '380', offense: 'Theft in dwelling house', bailable: false, desc: 'Non-Bailable.' },
            { id: '384', offense: 'Extortion', bailable: false, desc: 'Non-Bailable.' },
            { id: '392', offense: 'Robbery', bailable: false, desc: 'Non-Bailable.' },
            { id: '406', offense: 'Criminal Breach of Trust', bailable: false, desc: 'Non-Bailable.' },
            { id: '411', offense: 'Dishonestly receiving stolen property', bailable: false, desc: 'Non-Bailable (in AP).' },
            { id: '420', offense: 'Cheating (420)', bailable: false, desc: 'Non-Bailable. Anticipatory bail is possible in financial disputes.' },
            { id: '447', offense: 'Criminal Trespass', bailable: true, desc: 'Bailable offense.' },
            { id: '448', offense: 'House Trespass', bailable: true, desc: 'Bailable offense.' },
            { id: '498A', offense: 'Cruelty by Husband or Relatives', bailable: false, desc: 'Non-Bailable. However, arrest is not automatic (Arnesh Kumar guidelines).' },
            { id: '504', offense: 'Intentional insult with intent to provoke breach of peace', bailable: true, desc: 'Bailable offense.' },
            { id: '506', offense: 'Criminal Intimidation', bailable: true, desc: 'Bailable (Part 1). Non-Bailable (Part 2 - if threat is to cause death/grievous hurt).' },
            { id: '138', offense: 'Cheque Bounce (NI Act)', bailable: true, desc: 'Bailable. Usually a summons case.' },
            { id: '103', offense: 'Murder (BNS)', bailable: false, desc: 'Equivalent to IPC 302. Non-Bailable.' },
            { id: '316', offense: 'Causing death by negligence (BNS)', bailable: true, desc: 'Generally Bailable.' }
        ];

        function showSuggestions() {
            const input = document.getElementById('sectionInput').value.toLowerCase();
            const suggestionsBox = document.getElementById('suggestions');
            suggestionsBox.innerHTML = '';

            if (input.length < 1) {
                suggestionsBox.style.display = 'none';
                return;
            }

            const matches = bailData.filter(item =>
                item.id.toLowerCase().includes(input) ||
                item.offense.toLowerCase().includes(input)
            );

            if (matches.length > 0) {
                matches.forEach(match => {
                    const div = document.createElement('div');
                    div.innerHTML = `<strong>Sec ${match.id}</strong> - ${match.offense}`;
                    div.onclick = () => {
                        document.getElementById('sectionInput').value = match.id;
                        suggestionsBox.style.display = 'none';
                        checkBail();
                    };
                    suggestionsBox.appendChild(div);
                });
                suggestionsBox.style.display = 'block';
            } else {
                suggestionsBox.style.display = 'none';
            }
        }

        function checkBail() {
            const input = document.getElementById('sectionInput').value.trim().toUpperCase().replace('IPC', '').replace('BNS', '').replace('SEC', '').replace('SECTION', '').trim();
            const resultArea = document.getElementById('resultArea');
            const sectionName = document.getElementById('sectionName');
            const offense = document.getElementById('offense');
            const resultTitle = document.getElementById('resultTitle');
            const resultDesc = document.getElementById('resultDesc');
            const waLink = document.getElementById('waLink');

            if (!input) {
                alert('Please enter a section number or offense.');
                return;
            }

            // Find exact match first, then fuzzy
            let data = bailData.find(item => item.id === input);
            if (!data) {
                // Try finding by offense name if input is not a number
                data = bailData.find(item => item.offense.toLowerCase().includes(input.toLowerCase()));
            }

            if (data) {
                sectionName.innerText = `Section ${data.id}`;
                offense.innerText = data.offense;
                resultTitle.innerText = data.bailable ? '✅ BAILABLE' : '❌ NON-BAILABLE';
                resultTitle.className = data.bailable ? 'bailable' : 'non-bailable';
                resultDesc.innerText = data.desc;
                waLink.href = `https://wa.me/919440000417?text=Hello%20Advocate,%20I%20need%20help%20with%20Section%20${data.id}%20(${data.bailable ? 'Bailable' : 'Non-Bailable'}).`;
            } else {
                sectionName.innerText = `Search: ${input}`;
                offense.innerText = 'Data Not Found';
                resultTitle.innerText = '⚠️ CONTACT ADVOCATE';
                resultTitle.className = '';
                resultDesc.innerText = 'This specific section is not in our quick-check database. Please consult directly for accurate advice.';
                waLink.href = `https://wa.me/919440000417?text=Hello%20Advocate,%20I%20need%20info%20on%20Section%20${input}.`;
            }

            resultArea.style.display = 'block';
            resultArea.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
    <script src="chatbot.js"></script>
</body>

</html>
