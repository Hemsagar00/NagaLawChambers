<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Court Order Explainer | Naga Law Chambers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FFD700;
            --primary-dark: #b8860b;
            --bg: #0a0a0a;
            --card: #121212;
            --text: #e0e0e0;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Lato', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container { max-width: 600px; width: 100%; text-align: center; }
        h1 {
            font-family: var(--font-heading);
            color: var(--primary);
            margin: 0 0 20px;
            font-weight: 400;
            letter-spacing: 2px;
            font-size: 2rem;
        }
        .icon-box {
            width: 100px;
            height: 100px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            border: 2px solid rgba(255, 215, 0, 0.2);
        }
        .icon-box i {
            font-size: 40px;
            color: var(--primary);
        }
        .card {
            background: rgba(18, 18, 18, 0.9);
            padding: 50px 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }
        p { color: #888; line-height: 1.8; margin-bottom: 20px; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 30px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #000;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
            margin: 10px;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,215,0,0.3);
            color: var(--primary);
        }
        .btn-outline:hover {
            background: rgba(255,215,0,0.1);
            box-shadow: none;
        }
        .whatsapp-btn {
            background: #25D366;
            color: #fff;
        }
        .whatsapp-btn:hover {
            background: #1ebe57;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="icon-box">
                <i class="fa-solid fa-tools"></i>
            </div>
            <h1>Court Order Explainer</h1>
            <p>
                This AI-powered feature is currently being upgraded to provide you with better and more accurate explanations of court orders.
            </p>
            <p style="color: #666; font-size: 0.9rem;">
                In the meantime, our Advocate can personally explain your court order and guide you on the next steps.
            </p>
            
            <div style="margin-top: 30px;">
                <a href="https://wa.me/919440000417?text=Hello%20Advocate,%20I%20need%20help%20understanding%20my%20Court%20Order." 
                   target="_blank" class="btn whatsapp-btn">
                    <i class="fa-brands fa-whatsapp"></i> Get Personal Assistance
                </a>
                <a href="tools.html" class="btn btn-outline">
                    <i class="fa-solid fa-arrow-left"></i> Back to Tools
                </a>
            </div>
        </div>
    </div>
</body>

</html>
